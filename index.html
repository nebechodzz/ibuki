<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>静岡駅のお迎え</title>
    <style>
        body {
            background: linear-gradient(135deg, #ffd1dc 0%, #ff9a9e 100%);
            font-family: 'Arial', sans-serif;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .container {
            background: white;
            padding: 50px 40px;
            border-radius: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
            max-width: 650px;
            width: 90%;
            transition: all 0.3s ease;
        }

        img {
            width: 320px;
            height: 320px;
            border-radius: 20px;
            object-fit: cover;
            margin-bottom: 30px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #d63384;
            font-size: 32px;
            margin-bottom: 40px;
            font-weight: bold;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 30px;
            position: relative;
            height: 70px;
        }

        button {
            padding: 16px 36px;
            font-size: 22px;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        #iku-btn {
            background-color: #28a745;
            color: white;
        }

        #iku-btn:hover {
            background-color: #218838;
            transform: scale(1.1);
        }

        #ikanai-btn {
            background-color: #dc3545;
            color: white;
            position: absolute;
        }
    </style>
</head>
<body>

    <div class="container" id="main-card">
        <img id="main-img" src="https://gifdb.com/images/high/shinchan-sparkling-eyes-ikj6sz8tb4l3o3rb.webp" alt="かわいいGIF">
        <h1 id="main-question">静岡駅に迎えに来てくれない？😺</h1>
        
        <div class="buttons">
            <button id="iku-btn" onclick="sayIku()">いく</button>
            <button id="ikanai-btn" onmouseover="moveIkanai()" onclick="moveIkanai()">いかない</button>
        </div>
    </div>

    <script>
        const ikanaiTexts = [
            "いかない",
            "本当に？",
            "選択じゃないよ！",
            "いくしかないよ笑！",
            "逃がさないよ笑",
            "バーカ,こっちだよ笑"
        ];
        let clickCount = 0;

        function moveIkanai() {
            const ikanaiBtn = document.getElementById('ikanai-btn');
            
            clickCount = (clickCount + 1) % ikanaiTexts.length;
            ikanaiBtn.innerText = ikanaiTexts[clickCount];

            const x = Math.random() * (window.innerWidth - 200);
            const y = Math.random() * (window.innerHeight - 150);
            
            ikanaiBtn.style.position = 'fixed';
            ikanaiBtn.style.left = x + 'px';
            ikanaiBtn.style.top = y + 'px';
        }

        function sayIku() {
            // Tady se na pozadí odešle notifikace na váš e-mail přes Formspree
            fetch('https://formspree.io/f/xbglgjjz', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ response: 'Ona kliknula na Iku (Jdu)! 静岡駅に来てくれるよ！' })
            }).catch(error => console.log('Notification sent'));

            // Změna obsahu stránky po kliknutí na "いく"
            const card = document.getElementById('main-card');
            card.innerHTML = `
                <img src="https://gifdb.com/images/high/shinchan-amazed-eyes-5uuozznkos1fu27c.webp" alt="喜んでいるGIF">
                <h1 style="color: #d63384;">楽しみにしてる！</h1>
            `;
        }
    </script>
</body>
</html>
